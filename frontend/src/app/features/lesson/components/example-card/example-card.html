<article
  class="example-card"
  [class.example-card--affirmative]="sentenceType === 'affirmative'"
  [class.example-card--negative]="sentenceType === 'negative'"
  [class.example-card--interrogative]="sentenceType === 'interrogative'"
>

  <!-- Top bar: sentence type label -->
  <header class="example-card__header">
    <span class="example-card__type-badge">
      <span class="example-card__type-icon" aria-hidden="true">{{ sentenceIcon }}</span>
      {{ sentenceLabel }}
    </span>

    <div class="example-card__actions">
      <button
        class="btn btn--icon btn--disabled"
        disabled
        title="Listen to pronunciation (coming in Phase 2)"
        aria-label="Listen to pronunciation"
        (click)="onListenClick()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" /></svg>
        <span>Listen</span>
      </button>

      <button
        class="btn btn--icon btn--disabled"
        disabled
        title="Record and compare pronunciation (coming in Phase 3)"
        aria-label="Record audio"
        (click)="onRecordClick()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" /></svg>
        <span>Record</span>
      </button>
    </div>
  </header>

  <!-- Main content -->
  <div class="example-card__body">

    <!-- English phrase (primary) -->
    <p class="example-card__phrase" lang="en">{{ example.phrase }}</p>

    <!-- IPA Notation -->
    @if (example.ipa_notation) {
      <p class="example-card__ipa" aria-label="IPA pronunciation">
        <span class="example-card__ipa-label">Pronunciation:</span>
        {{ example.ipa_notation }}
      </p>
    }

    <!-- Spanish translation -->
    <div class="example-card__translation-row">
      <span class="translation-badge" aria-hidden="true">ES</span>
      <p class="example-card__translation" lang="es">{{ example.translation }}</p>
    </div>
  </div>

  <!-- Grammar anatomy: highlight sentence parts -->
  <footer class="example-card__anatomy">
    <span class="anatomy-chip anatomy-chip--structure">
      <span class="anatomy-chip__dot"></span>
      {{ sentenceStructureHint }}
    </span>
  </footer>

</article>
